worker_processes 4;
error_log /dev/stdout;
pid /run/nginx.pid;

load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;

include /usr/lib/nginx/modules/*.conf;
events {
    worker_connections 1024;
}

http {
    server_tokens off;
    more_clear_headers Server;
    include /etc/nginx/mime.types;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;
    error_log   /dev/stdout  debug;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    proxy_cache_path /dev/shm levels=1 keys_zone=jwk:1m max_size=10m;

    # external facing server on 80 with redirect to 443
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        return 301 https://$host$request_uri;
    }

    # external facing server on 443
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;
        http2 on;

        sendfile                  on;
        gzip                      on;
        gzip_proxied              no-cache no-store private expired auth;
        ssl_certificate           "/etc/nginx/certs/live/$ssl_server_name/fullchain.pem";
        ssl_certificate_key       "/etc/nginx/certs/live/$ssl_server_name/privkey.pem";
        ssl_session_cache         shared:SSL:1m;
        ssl_session_timeout       10m;
        ssl_protocols             TLSv1.3;
        ssl_ciphers               ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers on;
        tcp_nodelay               on;
        client_max_body_size      0;
        ignore_invalid_headers    off;
        chunked_transfer_encoding on;

        resolver 127.0.0.11 ipv6=off valid=3s;

        # backend server everything
        location / {
            # use variable to disable dns caching
            set $bck "10.0.7.3";
            proxy_intercept_errors     on;
            client_max_body_size       0;
            client_body_buffer_size    128k;
            proxy_pass                 http://$bck:8188;
            proxy_redirect             off;
            proxy_connect_timeout      60;
            proxy_send_timeout         60;
            proxy_read_timeout         60;
            proxy_buffering            off;
            proxy_request_buffering    off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme          $scheme;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;

            # comfyui not answering yet (container starting, restarting or
            # still loading): show a friendly "starting up" page instead of
            # the bare nginx "502 Bad Gateway"
            error_page 502 504 = @starting;
        }

        location @starting {
            internal;
            default_type text/html;
            content_by_lua_block {
                ngx.status = 503
                ngx.header["Retry-After"] = "5"
                ngx.header["Cache-Control"] = "no-store"
                ngx.say([[<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>ComfyUI is starting up</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6fa;
    --fg: #1d2330;
    --muted: #5b6472;
    --card: #ffffff;
    --accent: #4f7cff;
    --track: #dfe4ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218;
      --fg: #e7ebf3;
      --muted: #9aa3b2;
      --card: #181c25;
      --accent: #7b9dff;
      --track: #2a3140;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    padding: 40px 36px;
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .spinner {
    width: 56px;
    height: 56px;
    margin: 0 auto 24px;
    border-radius: 50%;
    border: 5px solid var(--track);
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  h1 { font-size: 1.4rem; margin: 0 0 12px; font-weight: 650; }
  p { margin: 0 0 8px; color: var(--muted); line-height: 1.5; }
  .dots::after {
    content: "";
    display: inline-block;
    width: 1.2em;
    text-align: left;
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75%, 100% { content: "..."; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner, .dots::after { animation-duration: 3s; }
  }
</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>ComfyUI is starting up<span class="dots"></span></h1>
    <p>The service is not answering yet. This page refreshes automatically every few seconds.</p>
    <p>If it stays like this for a while, the container may be restarting or failing to start.</p>
  </main>
</body>
</html>]])
            }
        }
    }
}
